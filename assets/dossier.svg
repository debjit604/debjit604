<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Subject dossier" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
.k{font-size:15px;letter-spacing:3px;fill:#8d7a45}.v{font-size:22px;fill:#efe6d0}
.row{animation:r .8s both}@keyframes r{from{opacity:0;transform:translateX(-14px)}to{opacity:1}}
.dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
</style>
<rect width="1200" height="400" fill="#101012"/>
<rect x="10" y="10" width="1180" height="380" fill="none" stroke="#c9a24b" stroke-opacity=".5"/>
<rect x="10" y="10" width="1180" height="46" fill="#c9a24b" fill-opacity=".08"/>
<text class="mono" x="34" y="40" font-size="16" letter-spacing="5" fill="#c9a24b">SUBJECT DOSSIER  //  PHOENIX-604</text>
<g class="mono">
<g class="row"><text class="k" x="40" y="104">CODENAME</text><text class="v" x="300" y="104">PHOENIX</text></g>
<g class="row" style="animation-delay:.15s"><text class="k" x="40" y="146">DISCIPLINE</text><text class="v" x="300" y="146">Red Teaming · Bug Bounty · VAPT · IR</text></g>
<g class="row" style="animation-delay:.3s"><text class="k" x="40" y="188">ARSENAL</text><text class="v" x="300" y="188">Python · C/C++ · JS · WASM · WebGL2</text></g>
<g class="row" style="animation-delay:.45s"><text class="k" x="40" y="230">TOOLKIT</text><text class="v" x="300" y="230">Burp Pro · Metasploit · Ghidra · BloodHound</text></g>
<g class="row" style="animation-delay:.6s"><text class="k" x="40" y="272">EDUCATION</text><text class="v" x="300" y="272">B.Sc. Cyber Security · IAER · Batch 2029</text></g>
<g class="row" style="animation-delay:.75s"><text class="k" x="40" y="314">FOUNDER OF</text><text class="v" x="300" y="314">CyberSec Cohort (mentorship)</text></g>
<g class="row" style="animation-delay:.9s"><text class="k" x="40" y="356">STATUS</text><circle class="dot" cx="312" cy="349" r="7" fill="#c0392b"/><text class="v" x="334" y="356" fill="#c0392b" style="fill:#e06a5a">ACTIVE — hunting</text></g>
</g>
<g transform="translate(1010 215)"><circle r="100" fill="none" stroke="#c9a24b" stroke-opacity=".35"/><circle r="70" fill="none" stroke="#c9a24b" stroke-opacity=".2"/><circle r="40" fill="none" stroke="#c9a24b" stroke-opacity=".2"/><path d="M-100 0H100M0 -100V100" stroke="#c9a24b" stroke-opacity=".2"/><g><path d="M0 0L100 0A100 100 0 0 0 70.7 -70.7Z" fill="#c9a24b" fill-opacity=".18"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></path></g><circle cx="38" cy="-52" r="4" fill="#e06a5a"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g>
</svg>
