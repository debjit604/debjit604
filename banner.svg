<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Debjit Das — PHOENIX — Red Team Operator and Bug Bounty Hunter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0d"/><stop offset="1" stop-color="#1c1b1f"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9a24b" stroke-opacity=".06"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a24b" stop-opacity="0"/><stop offset=".5" stop-color="#c9a24b" stop-opacity=".18"/><stop offset="1" stop-color="#c9a24b" stop-opacity="0"/></linearGradient>
<clipPath id="type"><rect x="70" y="228" height="40" width="0"><animate attributeName="width" from="0" to="1000" dur="3.2s" begin="0.6s" fill="freeze" calcMode="linear"/></rect></clipPath>
</defs>
<style>
.mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
.serif{font-family:Fraunces,Georgia,'Times New Roman',serif}
.stamp{animation:stamp 1.2s .4s both cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(2.2)}to{opacity:.9;transform:rotate(-12deg) scale(1)}}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
.scan{animation:s 5s linear infinite}@keyframes s{from{transform:translateY(-80px)}to{transform:translateY(340px)}}
.fade{animation:f 1.4s both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#grid)"/>
<rect class="scan" x="0" y="0" width="1200" height="80" fill="url(#scan)"/>
<rect x="14" y="14" width="1172" height="292" fill="none" stroke="#c9a24b" stroke-opacity=".55"/>
<rect x="22" y="22" width="1156" height="276" fill="none" stroke="#c9a24b" stroke-opacity=".2"/>
<text class="mono" x="70" y="62" font-size="14" letter-spacing="4" fill="#c9a24b">CASE FILE  ·  No. 604  ·  EYES ONLY</text>
<text class="serif fade" x="68" y="160" font-size="86" font-weight="700" fill="#efe6d0">Debjit Das</text>
<text class="serif fade" x="72" y="205" font-size="30" font-style="italic" fill="#c9a24b" style="animation-delay:.5s">a.k.a. PHOENIX</text>
<g clip-path="url(#type)"><text class="mono" x="70" y="256" font-size="20" fill="#d9d2c0">Red Team Operator · Bug Bounty Hunter · Kolkata, IN</text></g>
<rect class="blink" x="760" y="238" width="11" height="22" fill="#c9a24b"/>
<g class="stamp" style="transform-origin:1000px 140px"><g transform="translate(1000 140) rotate(-12)"><rect x="-150" y="-48" width="300" height="96" fill="none" stroke="#8b1a1a" stroke-width="5"/><rect x="-142" y="-40" width="284" height="80" fill="none" stroke="#8b1a1a" stroke-width="1.5"/><text class="mono" y="10" text-anchor="middle" font-size="38" font-weight="700" letter-spacing="6" fill="#a82222">CLASSIFIED</text></g></g>
</svg>
